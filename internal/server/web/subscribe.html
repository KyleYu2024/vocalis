{{define "subscribe.html"}}<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>订阅 {{.Title}}</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header class="topbar">
  <div class="wrap">
    <div class="crumbs"><a href="/">← 返回书架</a></div>
    <h1>订阅《{{.Title}}》</h1>
    <p class="muted">用 iPhone / iPad 自带播客 App 收听</p>
  </div>
</header>

<main class="wrap">
  <section class="card">
    <h2>方式一：点按钮直接添加</h2>
    <p class="muted small">在装有播客 App 的设备上打开本页，点下面的按钮即可跳转订阅。若跳转失败，用方式二。</p>
    <p><a class="btn green" href="{{safeURL .AppLink}}">在播客 App 中打开</a></p>
  </section>

  <section class="card">
    <h2>方式二：手动添加</h2>
    <ol class="muted small">
      <li>播客 App → <b>资料库</b> → 右上角 <b>⋯</b> → <b>通过 URL 添加节目</b></li>
      <li>粘贴下面的地址（可先点“复制地址”）</li>
    </ol>
    <div class="row">
      <input class="url" readonly value="{{.FeedURL}}" onclick="this.select()">
      <button class="btn" data-copy="{{.FeedURL}}">复制地址</button>
    </div>
  </section>

  <section class="card">
    <h2>方式三：扫二维码</h2>
    <p class="muted small">用手机相机扫码打开本页，再点“在播客 App 中打开”。</p>
    <div class="qr"><img src="{{.QR}}" alt="二维码"></div>
  </section>
</main>
<script src="/static/app.js"></script>
</body>
</html>
{{end}}
